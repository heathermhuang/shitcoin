name: Check delistings

# Daily detector for new Binance monitoring/delisting announcements + Coinbase
# trading-status changes. Opens a PR when something changes; no-op otherwise.
#
# Requires repo secret PROXY_URL (residential HTTP proxy) — binance.com blocks
# datacenter IPs, so the GitHub runner must reach Binance through it.
# Also requires: Settings → Actions → "Allow GitHub Actions to create and
# approve pull requests" (enabled).

on:
  schedule:
    - cron: '17 6 * * *'   # ~06:17 UTC daily
  workflow_dispatch:        # manual run from the Actions tab
    inputs:
      selftest:
        description: 'Force a throwaway test PR to verify the PR path (safe to close)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps (undici for the proxy dispatcher)
        run: npm ci

      - name: Detect changes
        id: detect
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          # Grep stdout, not the report file: when the Binance fetch dies and
          # Coinbase is quiet there are no "changes", so no file is ever written —
          # yet that is precisely the run we must not let pass silently.
          node scripts/check-delistings.mjs --apply | tee /tmp/report.txt

          if grep -q 'BINANCE_FETCH_FAILED' /tmp/report.txt; then
            echo "binance_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "binance_failed=false" >> "$GITHUB_OUTPUT"
          fi

          sig=$(sed -n 's/.*findings-signature: \([0-9a-f]*\).*/\1/p' /tmp/report.txt | head -1)
          if [ "${{ inputs.selftest }}" = "true" ]; then
            printf '# Pipeline self-test\n\nManual verification of the PR path — no real data change. Safe to close.\n' > data/pending-update.md
            sig="selftest-${GITHUB_RUN_ID}"
          fi
          echo "sig=${sig:-unknown}" >> "$GITHUB_OUTPUT"

          if [ -f data/pending-update.md ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Branch is named after the findings signature, not a fixed string. Identical
      # findings on consecutive days reuse the branch and quietly update one PR;
      # a genuinely new finding opens a NEW PR, which is the only thing that
      # actually notifies anyone. (A single fixed branch meant a July 29 Coinbase
      # delisting sat unnoticed for five days while the PR was silently amended.)
      - name: Open PR if anything changed
        if: steps.detect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/delisting-update-${{ steps.detect.outputs.sig }}
          delete-branch: true
          # pending-update.md is deliberately NOT committed. It is a per-run
          # artifact that the detector only ever writes and never deletes, and the
          # `changed` gate above is `[ -f data/pending-update.md ]`. Commit it once
          # and every later checkout starts with the file already there, so the gate
          # is true forever and a PR opens EVERY day regardless of findings — the
          # exact noise the gate exists to prevent. body-path below still reads it
          # straight off the runner's disk, so the PR body is unaffected.
          # The detector now edits data/tracked-tokens.json, not index.html —
          # index.html carries only the __TRACKED_TOKENS__ placeholder that
          # build.js fills. Leaving index.html here would silently commit nothing.
          add-paths: |
            data/tracked-tokens.json
            data/coinbase-snapshot.json
          commit-message: 'data: auto-detected delisting/monitoring changes'
          title: 'data: auto-detected Binance/Coinbase changes — needs review'
          body-path: data/pending-update.md
          labels: auto-update

      # Runs after the PR step so a Coinbase-only finding still gets its PR, but
      # the job still goes red — a blind detector must never report a green check.
      - name: Fail if the Binance fetch broke
        if: steps.detect.outputs.binance_failed == 'true'
        run: |
          echo "::error::Binance fetch failed — the detector was blind to announcements this run. Check the PROXY_URL secret."
          exit 1
