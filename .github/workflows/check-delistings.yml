name: Check delistings

# Daily detector for new Binance monitoring/delisting announcements + Coinbase
# trading-status changes. Opens a PR when something changes; no-op otherwise.
#
# Requires repo secret PROXY_URL (residential HTTP proxy) — binance.com blocks
# datacenter IPs, so the GitHub runner must reach Binance through it.
# Also requires: Settings → Actions → "Allow GitHub Actions to create and
# approve pull requests" (enabled).

on:
  schedule:
    - cron: '17 6 * * *'   # ~06:17 UTC daily
  workflow_dispatch:        # manual run from the Actions tab
    inputs:
      selftest:
        description: 'Force a throwaway test PR to verify the PR path (safe to close)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps (undici for the proxy dispatcher)
        run: npm ci

      - name: Detect changes
        id: detect
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          node scripts/check-delistings.mjs --apply
          if [ "${{ inputs.selftest }}" = "true" ]; then
            printf '# Pipeline self-test\n\nManual verification of the PR path — no real data change. Safe to close.\n' > data/pending-update.md
          fi
          if [ -f data/pending-update.md ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR if anything changed
        if: steps.detect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/delisting-update
          delete-branch: true
          add-paths: |
            index.html
            data/coinbase-snapshot.json
            data/pending-update.md
          commit-message: 'data: auto-detected delisting/monitoring changes'
          title: 'data: auto-detected Binance/Coinbase changes — needs review'
          body-path: data/pending-update.md
          labels: auto-update
